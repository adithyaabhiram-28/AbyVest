# Nginx reverse proxy for AbyVest on AWS EC2 (or any Linux host).
# Place on the server as /etc/nginx/sites-available/abyvest
# and symlink to sites-enabled. Do NOT expose Gunicorn publicly.

upstream abyvest_app {
    server 127.0.0.1:2005;
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # replace with your domain, e.g. abyvest.example.com

    client_max_body_size 5M;

    location / {
        proxy_pass http://abyvest_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

